# envsubst template, NOT a ready-to-use nginx config.
#
# The Dockerfile installs this at /etc/nginx/default.conf.template. On container
# start docker/15-render-nginx-conf.sh expands ${CSP_API_ORIGIN} and
# ${CSP_KEYCLOAK_ORIGIN} and writes the result to /etc/nginx/conf.d/default.conf.
# Both values are derived from VITE_API_BASE_URI and VITE_KEYCLOAK_URL, so .env
# stays the single source of truth and no real hostname is committed to this repo.
#
# That script names the two variables explicitly when calling envsubst, which is
# why nginx's own $uri / $host / $content_security_policy survive untouched.
#
# Serves plain HTTP on port 80; TLS is terminated by the host nginx in front.

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    root /usr/share/nginx/html;
    index index.html;

    # Defined once here and referenced by every add_header below. nginx inherits
    # add_header into a nested location ONLY when that location declares no
    # add_header of its own, so the asset block has to repeat the headers - but it
    # repeats the *variable*, not the policy text, so the two can never disagree.
    #
    # connect-src must name the real Keycloak and API origins or the browser blocks
    # keycloak-js's PKCE token exchange, and init() rejects with the app stuck on
    # "Authentication Required". style-src needs unsafe-inline for React inline
    # style props.
    set $content_security_policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${CSP_API_ORIGIN} ${CSP_KEYCLOAK_ORIGIN}; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'";

    add_header Content-Security-Policy $content_security_policy always;
    # Keeps OAuth authorization codes in the query string out of the Referer header.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~* \.(jpg|jpeg|png|gif|css|js|woff2?|ttf|eot|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy $content_security_policy always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
