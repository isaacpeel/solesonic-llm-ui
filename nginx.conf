server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # nginx inherits add_header into a nested location ONLY when that location declares
    # no add_header of its own, so the asset block below repeats these deliberately.
    #
    # connect-src must name the real Keycloak and API origins (VITE_KEYCLOAK_URL and
    # VITE_API_BASE_URI). style-src needs unsafe-inline for React inline style props.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://API_HOST https://KEYCLOAK_HOST; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    # Keeps OAuth authorization codes in the query string out of the Referer header.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ~* \.(jpg|jpeg|png|gif|css|js|woff2?|ttf|eot|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://API_HOST https://KEYCLOAK_HOST; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}